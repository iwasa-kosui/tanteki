name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:skill-package
      - run: npm run typecheck:benchmark
      - run: npm test
      - run: npm run lint:docs

  isolated-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run benchmark -- build --out .cache/benchmark-build
      - run: npx tsx benchmarks/isolated/smoke.ts .cache/benchmark-build/runtime-lock.json .cache/benchmark-smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: isolated-benchmark-diagnostics
          path: .cache/benchmark-smoke
